[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-mt5-copytrader"
version = "1.1.0"
description = "Low-latency Telegram Web signal copier for MetaTrader 5 with deterministic parsing and OpenCode Go classification"
requires-python = ">=3.11"
dependencies = [
  "MetaTrader5",
  "playwright>=1.46,<2",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tg-mt5-copytrader = "tg_mt5_copytrader.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
